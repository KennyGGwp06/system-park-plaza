# Despliegue en un servidor con aaPanel (2026-10-12). Guía: DESPLIEGUE_AAPANEL.md
# El Nginx de aaPanel ya ocupa los puertos 80/443 y gestiona los certificados SSL (Let's Encrypt), por eso aquí no hay
# Caddy: el ERP y la app del cliente escuchan SOLO en 127.0.0.1 y cada sitio de aaPanel hace de proxy inverso hacia ellos.
#   erp.tudominio.com      → 127.0.0.1:${ERP_PORT}       (ERP del personal y del dueño, reloj de asistencia)
#   reservas.tudominio.com → 127.0.0.1:${CUSTOMER_PORT}  (app del cliente)
# La API va dentro de cada sitio (/api y /socket.io): no hace falta un tercer dominio. Postgres no se publica.
# Uso: docker compose -f docker-compose.aapanel.yml --env-file .env.aapanel up -d --build
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - park_plaza_private
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:?DEMO_STAFF_PASSWORD is required}
      FRONTEND_URL: https://${ERP_DOMAIN:?ERP_DOMAIN is required}
      CUSTOMER_URL: https://${CUSTOMER_DOMAIN:?CUSTOMER_DOMAIN is required}
      # Delante van el Nginx de aaPanel y el nginx del contenedor del ERP/cliente: 2 saltos, para ver la IP real.
      TRUST_PROXY: "2"
      UPLOAD_DIR: /app/uploads
      SUNAT_MODE: ${SUNAT_MODE:-demo}
      SUNAT_ADAPTER_URL: ${SUNAT_ADAPTER_URL:-}
      SUNAT_ADAPTER_TOKEN: ${SUNAT_ADAPTER_TOKEN:-}
      SUNAT_ADAPTER_TIMEOUT_MS: ${SUNAT_ADAPTER_TIMEOUT_MS:-30000}
      SUNAT_INVOICE_SERIES: ${SUNAT_INVOICE_SERIES:-F001}
      SUNAT_RECEIPT_SERIES: ${SUNAT_RECEIPT_SERIES:-B001}
    expose:
      - "3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    stop_grace_period: 20s
    # 1 copia alcanza para el demo (servidor de 2 GB). Con 4 GB o más se puede subir a 2: el tiempo real y los
    # límites de intentos ya se comparten entre copias por Postgres.
    deploy:
      replicas: ${BACKEND_REPLICAS:-1}
    networks:
      - park_plaza_private
    logging: *default-logging

  # Respaldo diario a las 03:00 (hora del contenedor) en ./backups, guardando BACKUP_KEEP_DAYS días.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - uploads_data:/uploads:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ahora=$$(date +%H%M)
          if [ "$$ahora" = "0300" ] || [ ! -f /backups/.ultimo ]; then
            archivo=/backups/park-plaza-$$(date +%Y-%m-%d_%H%M).dump
            umask 077
            if pg_dump -Fc -f "$$archivo" && tar czf "$${archivo%.dump}.uploads.tgz" -C /uploads . && (cd /backups && sha256sum "$$(basename "$$archivo")" "$$(basename "$${archivo%.dump}.uploads.tgz")") > "$${archivo%.dump}.sha256"; then
              date -Iseconds > /backups/.ultimo
              echo "Respaldo listo: $$archivo"
              find /backups -name 'park-plaza-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
              find /backups -name 'park-plaza-*.uploads.tgz' -mtime +$$BACKUP_KEEP_DAYS -delete
              find /backups -name 'park-plaza-*.sha256' -mtime +$$BACKUP_KEEP_DAYS -delete
            else
              echo "ERROR: falló el respaldo"
            fi
            sleep 70
          fi
          sleep 30
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - park_plaza_private
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ERP_PORT:-18081}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - park_plaza_private
    logging: *default-logging

  customer:
    build:
      context: .
      dockerfile: customer/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CUSTOMER_PORT:-18082}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - park_plaza_private
    logging: *default-logging

networks:
  park_plaza_private:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
