# Bloque para pegar en aaPanel › Website › (tu sitio) › Config, DENTRO del bloque "server { ... }" que aaPanel crea
# para el dominio, reemplazando los "location /" que trae por defecto (deja intactas las líneas de SSL que agrega aaPanel).
# Úsalo dos veces:
#   - sitio erp.tudominio.com       → PUERTO = 18081 (ERP_PORT)
#   - sitio reservas.tudominio.com  → PUERTO = 18082 (CUSTOMER_PORT)
# Cambia 18081 por el puerto que corresponda en las 3 líneas proxy_pass.
#
# IMPORTANTE: borra también los bloques que aaPanel agrega por defecto para estáticos, por ejemplo
#     location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { expires 30d; ... }
#     location ~ .*\.(js|css)?$ { expires 12h; ... }
# Si se quedan, Nginx busca los .js/.css en la carpeta del sitio (vacía) en lugar de pedirlos al contenedor y la
# pantalla sale en blanco (404 en /assets/...).

    client_max_body_size 12m;   # fotos de evidencias y del catálogo

    # Tiempo real (Socket.IO): necesita mantener la conexión abierta y el "upgrade" a websocket.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # aaPanel suele cachear estáticos en sus reglas por defecto: aquí no, porque cada versión nueva debe verse al instante.
        proxy_buffering on;
    }
