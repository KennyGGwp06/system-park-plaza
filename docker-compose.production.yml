x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - park_plaza_private
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:?DEMO_STAFF_PASSWORD is required}
      FRONTEND_URL: https://${ERP_DOMAIN:?ERP_DOMAIN is required}
      CUSTOMER_URL: https://${CUSTOMER_DOMAIN:?CUSTOMER_DOMAIN is required}
      # Caddy y nginx van delante: 2 saltos, para que el servidor vea la IP real de cada cliente.
      TRUST_PROXY: "2"
      UPLOAD_DIR: /app/uploads
      SUNAT_MODE: ${SUNAT_MODE:-demo}
      SUNAT_ADAPTER_URL: ${SUNAT_ADAPTER_URL:-}
      SUNAT_ADAPTER_TOKEN: ${SUNAT_ADAPTER_TOKEN:-}
      SUNAT_ADAPTER_TIMEOUT_MS: ${SUNAT_ADAPTER_TIMEOUT_MS:-30000}
      SUNAT_INVOICE_SERIES: ${SUNAT_INVOICE_SERIES:-F001}
      SUNAT_RECEIPT_SERIES: ${SUNAT_RECEIPT_SERIES:-B001}
    expose:
      - "3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    stop_grace_period: 20s
    # Varias copias del servidor (Fase 2 de escalabilidad): comparten la base, el tiempo real va por
    # Postgres (LISTEN/NOTIFY) y los límites de intentos también. nginx reparte los pedidos entre ellas.
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    networks:
      - park_plaza_private
    logging: *default-logging

  # Respaldo automático: una copia completa de la base cada día a las 03:00 (hora del contenedor, UTC por
  # defecto) en ./backups, guardando los últimos BACKUP_KEEP_DAYS días. Conviene además copiar esa carpeta
  # fuera del servidor (otro disco o la nube).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ahora=$$(date +%H%M)
          if [ "$$ahora" = "0300" ] || [ ! -f /backups/.ultimo ]; then
            archivo=/backups/park-plaza-$$(date +%Y-%m-%d_%H%M).dump
            if pg_dump -Fc -f "$$archivo"; then
              date -Iseconds > /backups/.ultimo
              echo "Respaldo listo: $$archivo"
              find /backups -name 'park-plaza-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
            else
              echo "ERROR: falló el respaldo"
            fi
            sleep 70
          fi
          sleep 30
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - park_plaza_private
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - park_plaza_private
    logging: *default-logging

  customer:
    build:
      context: .
      dockerfile: customer/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - park_plaza_private
    logging: *default-logging


  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ERP_DOMAIN: ${ERP_DOMAIN:?ERP_DOMAIN is required}
      CUSTOMER_DOMAIN: ${CUSTOMER_DOMAIN:?CUSTOMER_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      customer:
        condition: service_healthy
    networks:
      - park_plaza_private
    logging: *default-logging

networks:
  park_plaza_private:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
