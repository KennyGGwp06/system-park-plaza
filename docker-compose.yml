services:
  postgres:
    image: postgres:16-alpine
    container_name: park_plaza_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_park_plaza}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - park_plaza_network

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: park_plaza_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PARK_PLAZA_DEMO: "true"
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-hotel_park_plaza}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-hotel_park_plaza}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:-ParkPlaza123*}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CUSTOMER_URL: ${CUSTOMER_URL:-http://localhost:4173}
      OPERATIONS_URL: ${OPERATIONS_URL:-http://localhost:4174}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - park_plaza_network

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: park_plaza_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - park_plaza_network

  customer:
    build:
      context: .
      dockerfile: customer/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: park_plaza_customer
    restart: unless-stopped
    ports:
      - "${CUSTOMER_PORT:-4173}:80"
    depends_on:
      - backend
    networks:
      - park_plaza_network

  operations:
    build:
      context: .
      dockerfile: operations/Dockerfile
      args:
        VITE_API_URL: ${OPERATIONS_API_URL:-/api}
    container_name: park_plaza_operations
    restart: unless-stopped
    ports:
      - "${OPERATIONS_PORT:-4174}:80"
    depends_on:
      - backend
    networks:
      - park_plaza_network

networks:
  park_plaza_network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
